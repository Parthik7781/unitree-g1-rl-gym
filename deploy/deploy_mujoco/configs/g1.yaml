# 
policy_path: "{LEGGED_GYM_ROOT_DIR}/deploy/pre_train/g1/motion.pt"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/g1_description/scene.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10

kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

default_angles: [-0.1,  0.0,  0.0,  0.3, -0.2, 0.0, 
                  -0.1,  0.0,  0.0,  0.3, -0.2, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 47

# Conservative arm posture for the walk.
# The G1 shoulder/elbow axes are not aligned with a simple straight-down pose,
# so the targets are slightly biased to keep the arms near the body without
# destabilizing the gait.
# Order: [L_sh_pitch, L_sh_roll, L_sh_yaw, L_elbow, R_sh_pitch, R_sh_roll, R_sh_yaw, R_elbow]
arm_target_angles: [0.2, -0.25, 0.0, 0.15, 0.2, 0.25, 0.0, 0.15]
arm_kp: 1.5
arm_kd: 0.25

cmd_init: [0.5, 0, 0]